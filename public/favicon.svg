<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.35"/>

  <!-- Inner Badge Container -->
  <g transform="translate(56, 56) scale(4)">
    <!-- Roof / Construction truss -->
    <path d="M12 42 L50 15 L88 42 M25 34 V46 M75 34 V46" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Buildings -->
    <path d="M35 43 H46 V67 H35 Z M49 35 H62 V67 H49 Z M65 43 H73 V67 H65 Z" fill="url(#goldGrad)"/>
    <path d="M39 48 H42 V54 H39 Z M53 41 H58 V47 H53 Z M53 52 H58 V58 H53 Z M68 48 H71 V54 H68 Z" fill="#111827"/>
    
    <!-- GB Monogram -->
    <text x="16" y="87" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="url(#goldGrad)" letter-spacing="-2">GB</text>
    <text x="62" y="84" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" opacity="0.9">ERP</text>
  </g>
</svg>